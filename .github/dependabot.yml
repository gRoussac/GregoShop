# Dependabot version updates for composer, npm theme locks, and GitHub Actions.
# Security-tab Dependabot alerts are a separate org Settings toggle.
# Majors: human review on every PR; do not auto-merge.
# npm: one grouped PR per directory (stops drip of transitive security bumps).
# Aligned with Interchouette-ITC/jhgr theme layout (admin-dev vs jhgr4dmeen; themes/default vs themes/jhgr).
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    target-branch: dev
    labels:
      - dependencies
    groups:
      composer:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    target-branch: dev
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /themes
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    target-branch: dev
    labels:
      - dependencies
    ignore:
      - dependency-name: eslint
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "eslint-*"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: stylelint
        update-types: [ "version-update:semver-major" ]
    groups:
      themes-core-npm:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /themes/default
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    target-branch: dev
    labels:
      - dependencies
    ignore:
      - dependency-name: eslint
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "eslint-*"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: stylelint
        update-types: [ "version-update:semver-major" ]
    groups:
      fo-default-npm:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /admin-dev/themes/default
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    target-branch: dev
    labels:
      - dependencies
    ignore:
      - dependency-name: eslint
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "eslint-*"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: stylelint
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "@babel/core"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "@babel/preset-env"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "@babel/eslint-parser"
        update-types: [ "version-update:semver-major" ]
    groups:
      bo-default-npm:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /admin-dev/themes/new-theme
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    target-branch: dev
    labels:
      - dependencies
    ignore:
      - dependency-name: eslint
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "eslint-*"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: stylelint
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "@babel/core"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "@babel/eslint-parser"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: bootstrap
        update-types: [ "version-update:semver-major" ]
      - dependency-name: typescript
        update-types: [ "version-update:semver-major" ]
      - dependency-name: vue-router
        update-types: [ "version-update:semver-major" ]
      - dependency-name: vue-i18n
        update-types: [ "version-update:semver-major" ]
    groups:
      bo-new-theme-npm:
        patterns:
          - "*"
