# Twig CS Fixer on PrestaShopBundle views.
# Runner: ubuntu-26.04. Action JS runtime: Node 24 (FORCE_JAVASCRIPT_ACTIONS_TO_NODE24).
name: CI Twig
on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
# Pull-requests on a private repository are not coming from a fork, so avoid running the same job twice with push and pull_request events.
  twig-cs-check:
    if: github.event_name != 'push' || !github.event.repository.private
    name: Twig CS Check
    runs-on: ubuntu-26.04

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          extensions: mbstring, intl, gd, xml, dom, json, fileinfo, curl, zip, iconv, simplexml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Directory
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Composer Install
        run: COMPOSER_PROCESS_TIMEOUT=600 composer install --ansi --prefer-dist --no-interaction --no-progress

      - name: Run Twig CS Fixer Check
        run: |
          composer run twig || {
            echo "::error::Twig CS Fixer check failed. Run 'composer run twig:fix' to fix the issues.";
            exit 1;
          }
