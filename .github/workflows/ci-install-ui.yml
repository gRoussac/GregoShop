# Rebuild install-ui and fail if committed install-dev/theme dist drifts.
name: CI Install UI
on:
  push:
    branches: [ dev ]
    paths:
      - "install-ui/**"
      - "install-dev/theme/js/install-app.js"
      - "install-dev/theme/css/install-app.css"
      - ".github/workflows/ci-install-ui.yml"
  pull_request:
    branches: [ dev ]
    paths:
      - "install-ui/**"
      - "install-dev/theme/js/install-app.js"
      - "install-dev/theme/css/install-app.css"
      - ".github/workflows/ci-install-ui.yml"
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  install-ui-dist:
    runs-on: ubuntu-26.04
    name: install-ui dist drift
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: install-ui/package-lock.json

      - name: Build install-ui
        working-directory: ./install-ui
        run: npm ci && npm run build

      - name: Fail on theme dist drift
        run: git diff --exit-code -- install-dev/theme/js/install-app.js install-dev/theme/css/install-app.css install-dev/theme/js/install-*.js install-dev/theme/assets
