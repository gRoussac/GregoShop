# UI sanity Playwright suite (Docker shop).
# Runner: ubuntu-26.04. Action JS runtime: Node 24 (FORCE_JAVASCRIPT_ACTIONS_TO_NODE24).
name: CI UI

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
permissions:
  contents: read   #   to fetch code (actions/checkout)

concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TEST_CAMPAIGN: 'sanity:fast-fail'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
# Pull-requests on a private repository are not coming from a fork, so avoid running the same job twice with push and pull_request events.
  # Define which PHP versions need to be used
  workflow_matrix_generator:
    if: github.event_name != 'push' || !github.event.repository.private
    name: Sanity matrix
    uses: ./.github/workflows/workflow-matrix-generator.yml
    with:
      matrix_type: sanity
  sanity:
    permissions:
      contents: read   #   to fetch code (actions/checkout)
    runs-on: ubuntu-26.04
    name: Sanity
    needs: workflow_matrix_generator
    strategy:
      matrix: ${{ fromJSON(needs.workflow_matrix_generator.outputs.dynamic_matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v7

      - name: Setup Environment
        timeout-minutes: 15
        uses: ./.github/actions/setup-env
        with:
          PHP_VERSION: ${{ matrix.php }}
          ENABLE_SSL: 'true'
          INSTALL_AUTO: 'false'
          DB_SERVER: ${{ matrix.db }}

      - name: Setup Environment failure
        uses: ./.github/actions/setup-env-export-logs
        with:
          ARTIFACT_NAME: setup-sanity-${{ matrix.php }}-${{ matrix.browser }}-${{ matrix.db }}
          DB_SERVER: ${{ matrix.db }}
          ENABLE_SSL: 'true'
          INSTALL_AUTO: 'false'
        if: failure()

      - name: Run Tests
        uses: ./.github/actions/ui-test
        with:
          TEST_CAMPAIGN: ${{ env.TEST_CAMPAIGN }}
          BROWSER: ${{ matrix.browser }}
          DB_SERVER: ${{ matrix.db }}

      - name: Export docker logs
        if: failure()
        run: |
          mkdir -p ./var/docker-logs
          COMPOSE=(docker compose -f docker/docker-compose.yml --project-directory .)
          if [[ "${{ matrix.db }}" = "mariadb" ]]; then
            COMPOSE+=(-f docker/compose.mariadb.yml)
          fi
          "${COMPOSE[@]}" logs "${{ matrix.db }}" > ./var/docker-logs/${{ matrix.db }}.log || true
          "${COMPOSE[@]}" logs php apache > ./var/docker-logs/prestashop.log || true

      - name: Upload Screenshots and logs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: sanity-${{ matrix.php }}-${{ matrix.browser }}-${{ matrix.db }}
          path: |
            ./tests/UI/screenshots/
            ./var/logs
            ./var/docker-logs
