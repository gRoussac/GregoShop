# Local stack: Apache + PHP-FPM + MySQL + Maildev
# From repo root: make docker-up
# FO: http://localhost:8001 / https://localhost:8002
# Maildev UI: http://localhost:1080

name: gregoshop

services:
  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWD:-prestashop}
      MYSQL_DATABASE: ${DB_NAME:-prestashop}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    restart: "no"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  php:
    build: ./docker/php
    volumes:
      - .:/var/www/html
    environment:
      DB_SERVER: ${DB_SERVER:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-prestashop}
      DB_USER: ${DB_USER:-root}
      DB_PASSWD: ${DB_PASSWD:-prestashop}
      DB_PREFIX: ${DB_PREFIX:-ps_}
      PS_DOMAIN: ${PS_DOMAIN:-localhost:8001}
      PS_FOLDER_INSTALL: ${PS_FOLDER_INSTALL:-install-dev}
      PS_FOLDER_ADMIN: ${PS_FOLDER_ADMIN:-admin-dev}
      PS_COUNTRY: ${PS_COUNTRY:-fr}
      PS_LANGUAGE: ${PS_LANGUAGE:-en}
      PS_ENABLE_SSL: ${PS_ENABLE_SSL:-0}
      PS_INSTALL_DEMO_PRODUCTS: ${PS_INSTALL_DEMO_PRODUCTS:-0}
      PS_ALL_LANGUAGES: ${PS_ALL_LANGUAGES:-0}
      ADMIN_MAIL: ${ADMIN_MAIL:-demo@prestashop.com}
      ADMIN_PASSWD: ${ADMIN_PASSWD:-Pr3st4Sh0P}
      ADMIN_FIRSTNAME: ${ADMIN_FIRSTNAME:-John}
      ADMIN_LASTNAME: ${ADMIN_LASTNAME:-Doe}
      PS_USE_DOCKER_MAILDEV: ${PS_USE_DOCKER_MAILDEV:-1}
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  apache:
    build: ./docker/apache
    ports:
      - "8001:80"
      - "8002:443"
    volumes:
      - .:/var/www/html:ro
    depends_on:
      - php
    restart: "no"

  maildev:
    image: maildev/maildev:2.1.0
    ports:
      - "1080:1080"
      - "1025:1025"
    restart: "no"

volumes:
  db-data:
